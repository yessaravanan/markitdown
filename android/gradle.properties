org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Which Tesseract model set to bundle: "fast" (~4 MB/lang, quicker) or "best" (~15 MB/lang, more accurate).
tessdataVariant=fast
# OCR languages bundled into the APK (Tesseract codes, comma separated). More can be imported in-app from a .traineddata file.
tessdataLanguages=eng
